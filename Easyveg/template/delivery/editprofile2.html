<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">

    <style>
        body {
            background: url("{% static 'images/bg_10.jpg' %}") no-repeat center center/cover;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        /* Green Navbar */
        .navbar-green {
            background-color: #2e8b57;
        }

        .navbar-green .navbar-brand,
        .navbar-green .nav-link {
            color: #ffffff !important;
            font-weight: 500;
        }

        /* Form Card */
        .edit-profile-container {
            max-width: 600px;
            margin: 100px auto;
            background: rgba(255, 255, 255, 0.92);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }

        .edit-profile-container h3 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            font-weight: 500;
            margin-bottom: 5px;
        }

        input {
            margin-bottom: 15px;
        }

        .btn-group-custom {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-green">
    <div class="container">
        <a class="navbar-brand" href="/">Vegefoods</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/">Home</a>
        </div>
    </div>
</nav>

<!-- Edit Profile Form -->
<div class="edit-profile-container">
    <h3>Edit Profile</h3>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Full Name</label>
        <input type="text" name="fullname" class="form-control"
               value="{{ deli.fullname }}" required>

        <label>Email</label>
        <input type="email" name="email" class="form-control"
               value="{{ deli.email }}" required>
        <label>Phone Number</label>
        <input type="text" name="phone" class="form-control"
               value="{{ deli.phonenumber }}" required>

        <label>Address</label>
        <input type="text" name="address" class="form-control"
               value="{{ deli.address }}" required>

        <label>Available Time</label>
        <input type="text" name="time" class="form-control"
               value="{{ deli.time }}" required>
{% comment %} 
        <label>Update License (optional)</label>
        <input type="file" name="liscenceimg" class="form-control"> {% endcomment %}

        <!-- Buttons -->
        <div class="btn-group-custom">
            <a href="{% url 'profile2' %}" class="btn btn-secondary">
                ← Back
            </a>

            <button type="submit" class="btn btn-success">
                Save Changes
            </button>
        </div>
    </form>
</div>

<!-- Bootstrap JS -->
<script src="{% static 'js/jquery.min.js' %}"></script>
<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>

</body>
</html>
