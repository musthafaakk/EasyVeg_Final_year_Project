<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delivery Man Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">

    <style>
        body {
            background: url("{% static 'images/del_2.jpg' %}") no-repeat center center/cover;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        /* Green Navbar */
        .navbar-green {
            background-color: #2e8b57;
        }

        .navbar-green .navbar-brand,
        .navbar-green .nav-link {
            color: #fff !important;
            font-weight: 500;
        }

        /* Profile Card */
        .profile-container {
            max-width: 600px;
            margin: 100px auto;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }

        .profile-container h3 {
            text-align: center;
            margin-bottom: 25px;
        }

        .profile-item {
            margin-bottom: 15px;
        }

        .profile-item label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .profile-item p {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 5px;
        }

        .btn-group-custom {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-green">
    <div class="container">
        <a class="navbar-brand" href="/">Vegefoods</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/">Home</a>
        </div>
    </div>
</nav>

<!-- Profile Card -->
<div class="profile-container">
    <h3>Delivery Man Profile</h3>

    <div class="profile-item">
        <label>Full Name</label>
        <p>{{ delivery.fullname }}</p>
    </div>

    <div class="profile-item">
        <label>Email</label>
        <p>{{ delivery.email }}</p>
    </div>

    <div class="profile-item">
        <label>Phone Number</label>
        <p>{{ delivery.phonenumber }}</p>
    </div>

    <div class="profile-item">
        <label>Address</label>
        <p>{{ delivery.address }}</p>
    </div>

    <div class="profile-item">
        <label>Available Time</label>
        <p>{{ delivery.time }}</p>
    </div>

    {% comment %} <div class="profile-item">
        <label>License</label>
        <p>
            <a href="{{ delivery.liscenceimg.url }}" target="_blank">
                View Uploaded License
            </a>
        </p>
    </div> {% endcomment %}

    <!-- Buttons -->
    <div class="btn-group-custom">
        <a href="deliveryhome" class="btn btn-secondary">
            ← Back
        </a>

        <a href="{% url 'deditprof2' delivery.id %}" class="btn btn-success">
            Edit Profile
        </a>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="{% static 'js/jquery.min.js' %}"></script>
<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>

</body>
</html>
