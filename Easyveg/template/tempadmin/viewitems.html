<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - View Items</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
  />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #ffffff2b;
    }

    .wrapper {
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: 250px;
      background-color: #2c3e50;
      min-height: 100vh;
      color: white;
    }

    .sidebar .logo-header {
      padding: 15px;
      text-align: center;
      background-color: #2c3e50;
    }

    .sidebar .logo-header img {
      height: 30px;
    }

    .sidebar ul.nav {
      list-style: none;
      padding: 0;
    }

    .sidebar ul.nav li {
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .sidebar ul.nav li a {
      display: flex;
      align-items: center;
      color: white;
      text-decoration: none;
      padding: 12px 20px;
    }

    .sidebar ul.nav li a i {
      margin-right: 10px;
    }

    .sidebar ul.nav li a:hover {
      background-color: #1a252f;
    }

    /* Main Panel */
    .main-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Header/Navbar */
    .main-header {
      background-color: #2c3e50;
      padding: 15px 20px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Container for table */
    .container {
      padding: 20px;
      margin: 20px;
      background-color: #57494974;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #000000ff;
    }

    /* Table styling */
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #801931ff; /* TABLE BACKGROUND */
    }

    table thead {
      background-color: #2c3e50;
      color: white;
    }

    table th, table td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #6d2222ff;
      vertical-align: middle;
    }

    /* Row background */
    table tbody tr {
      background-color: #2f314bff; /* ROW BACKGROUND */
    }

    /* Row hover color */
    table tbody tr:hover {
      background-color: #1c283fff; /* HOVER COLOR */
    }

    /* Image style */
    .product-image {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #491616ff;
    }

    .btn {
      padding: 6px 12px;
      border: none;
      border-radius: 5px;
      color: #000000ff;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.9em;
      margin-right: 5px;
    }

    .edit-btn {
      background-color: #007bff;
    }

    .edit-btn:hover {
      background-color: #0056b3;
    }

    .delete-btn {
      background-color: #dc3545;
    }

    .delete-btn:hover {
      background-color: #a71d2a;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .wrapper {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
      }
      table th, table td {
        font-size: 0.9em;
        padding: 8px;
      }
      .product-image {
        width: 60px;
        height: 60px;
      }
    }
  </style>
</head>
<body>

<div class="wrapper">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo-header">
      <img src="static/stadmin/assets/img/kaiadmin/logo_light.svg" alt="Logo">
    </div>
    <ul class="nav">
      <li><a href="indexadmin"><i class="fas fa-home"></i> BACK</a></li>
    </ul>
  </div>

  <!-- Main Panel -->
  <div class="main-panel">
    <div class="main-header">
      <div>Admin Panel</div>
      <div><span>Hi, Admin</span></div>
    </div>

    <!-- Table Container -->
    <div class="container">
      <h2>View Items</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Image</th>
            <th>Item Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
         {% for v in v %}
          <tr>
            <td style="color: white;">{{forloop.counter}}</td>
            <td>
              <button class="btn btn-primary btn-sm" onclick="openViewer('{{ v.productimage.url }}')" >
                View Image
              </button>
            </td>
            <td style="color: white;">{{v.productname}}</td>
            <td style="color: white;">{{v.category}}</td>
            <td style="color: white;">{{v.price}}</td>
            <td style="color: white;">{{v.quantity}}</td>
            <td>
              <a href="{% url 'dpedit' aid=v.id %}" class="btn edit-btn">Edit</a>
              <a href="{% url 'fdel' aid=v.id %}" class="btn delete-btn">Delete</a>
            </td>
          </tr>
         {% endfor %}

        <!-- Popup Viewer Modal -->
        

     <script>
function openViewer(imageUrl) {
  document.getElementById("viewerImage").src = imageUrl;
  var modal = new bootstrap.Modal(document.getElementById('viewerModal'));
  modal.show();
}
</script>


        </tbody>
     </table>
</div> <!-- container end -->

<!-- IMAGE VIEWER MODAL -->
<div class="modal fade" id="viewerModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-dark text-white">

      <!-- HEADER WITH CLOSE BUTTON -->
      <div class="modal-header border-0">
        <h5 class="modal-title">Image Preview</h5>
        <button type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="modal"
                aria-label="Close"></button>
      </div>

      <!-- MODAL BODY -->
      <div class="modal-body text-center">
        <img id="viewerImage"
             src=""
             style="width:200px; height:200px; object-fit:cover; border-radius:10px;">
      </div>

    </div>
  </div>
</div>


    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
