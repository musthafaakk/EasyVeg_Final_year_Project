<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: 
              linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)),
              url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Navbar */
        .navbar {
            background-color: #0ac729ff;
        }
        .navbar-brand, .nav-link {
            color: #fff !important;
            font-weight: 500;
        }

        .profile-card {
            max-width: 700px;
            margin: 80px auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.15);
        }

        .profile-header {
            background: #0d6efd;
            color: white;
            padding: 18px 22px;
            border-radius: 12px 12px 0 0;
            position: relative;
        }

        .back-btn {
            position: absolute;
            left: 20px;
            top: 18px;
        }

        .profile-header h3 {
            margin: 0;
            text-align: center;
        }

        .profile-body {
            padding: 30px;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="#">EASYVEG</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
      data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    {% comment %} <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="#">Edit Profile</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Logout</a>
        </li>
      </ul>
    </div> {% endcomment %}
  </div>
</nav>

<!-- Profile Card -->
<div class="profile-card">

    <div class="profile-header">
        <a href="javascript:history.back()" class="btn btn-light btn-sm back-btn">
            ← Back
        </a>
        <h3>Edit Profile</h3>
    </div>

    <div class="profile-body">
        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control"
                       value="{{ user.name }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control"
                       value="{{ user.email }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="tel" name="phone" class="form-control"
                       value="{{ user.phonenumber }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">State</label>
                <input type="text" name="state" class="form-control"
                       value="{{ user.state }}">
            </div>

            <div class="mb-3">
                <label class="form-label">District</label>
                <input type="text" name="district" class="form-control"
                       value="{{ user.district }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Address</label>
                <textarea name="address" class="form-control" rows="3">{{ user.address }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Pincode</label>
                <input type="text" name="pincode" class="form-control"
                       value="{{ user.pincode }}">
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Save Changes
            </button>
        </form>
    </div>
</div>

<!-- Bootstrap JS -->
<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
