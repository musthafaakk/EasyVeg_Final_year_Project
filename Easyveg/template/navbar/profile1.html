{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Profile</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #20B2AA, #008080);
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 100px;
    }
    .navbar {
      background-color: #009970 !important;
    }
    .card {
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      width: 400px;
      background-color: #fff;
    }
    .profile-pic {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #20B2AA;
      margin-top: -60px;
    }
    .card-title {
      color: #008080;
      font-weight: 600;
    }
    .info {
      color: #333;
      margin-bottom: 8px;
    }
    .back-btn {
      position: absolute;
      top: 15px;
      left: 20px;
      background-color: rgba(255,255,255,0.9);
      color: #009970;
      border-radius: 5px;
      font-weight: 500;
      text-decoration: none;
      padding: 6px 12px;
      transition: 0.3s;
    }
    .back-btn:hover {
      background-color: #fff;
      color: #007b5e;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container d-flex justify-content-between align-items-center">
      <!-- Back button (Top Left) -->
      <a href="javascript:history.back()" class="back-btn">
        <i class="icon-arrow-left"></i> Back
      </a>

      <!-- Brand -->
      <a class="navbar-brand mx-auto text-white" href="/" style="font-weight: 600; font-size: 1.5rem;">
        PROFILE
      </a>

      <!-- Right side (empty for spacing) -->
      <div style="width: 50px;"></div>
    </div>
  </nav>

  <!-- Profile Card -->
  <div class="card text-center p-4 mt-5">
    <div class="card-body">
      <img src="{% static 'images/person_4.jpg' %}" alt="Profile Picture" class="profile-pic mx-auto mb-3">
      <h3 class="card-title">{{ pro.name }}</h3>
      <p class="info"><strong>Name:{{ pro.name }}</strong> </p>
      <p class="info"><strong>Email:{{ pro.email }}</strong> </p>
      <p class="info"><strong>Phone:{{ pro.phonenumber }}</strong> </p>
      <p class="info"><strong>Address:{{ pro.address }}</strong> </p>
      <p class="info"><strong>Pincode:{{ pro.pincode }}</strong> </p> 
      <p class="info"><strong>District: {{ pro.district }}</strong></p>
      <p class="info"><strong>State:{{ pro.state }}</strong> </p>
      <p class="info"><strong>Joined:{{ pro.joined }}</strong> </p>

      <a href="{% url 'deditprof' pro.id  %}" class="btn text-white mt-3" style="background-color:#20B2AA;">edit profile</a>
    </div>
  </div>
</body>
</html>
