{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Profile</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #20B2AA, #008080);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
    }
    .card {
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      width: 400px;
      background-color: #fff;
    }
    .profile-pic {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #20B2AA;
      margin-top: -60px;
    }
    .card-title {
      color: #008080;
      font-weight: 600;
    }
    .info {
      color: #333;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="card text-center p-4">
    <div class="card-body">
      <img src="{% static 'images/person_4.jpg' %}" alt="Profile Picture" class="profile-pic mx-auto mb-3">
      <h3 class="card-title">{{ user.name }}</h3>
      <p class="info"><strong>Email:</strong> {{ user.email }}</p>
<p class="info"><strong>Phone:</strong> {{ user.phone }}</p>
<p class="info"><strong>Address:</strong> {{ user.address }}</p>
<p class="info"><strong>District:</strong> {{ user.district }}</p>
<p class="info"><strong>State:</strong> {{ user.state }}</p>
<p class="info"><strong>Joined:</strong> {{ user.joined }}</p>

      <a href="{% url 'userhome' %}" class="btn btn-teal text-white mt-3" style="background-color:#20B2AA;">Back to Home</a>
    </div>
  </div>
</body>
</html>
